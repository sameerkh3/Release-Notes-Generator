modules:
  # ============================================================================
  # MODULE TYPE CONFIGURATION
  # ============================================================================
  # Choose ONE of the module types below based on your deployment needs:
  #
  # Option 1: jira:projectPage (CURRENTLY ACTIVE)
  #   - Appears in project sidebar for ALL projects site-wide
  #   - Highly discoverable, all users can access
  #   - Best for: Internal use, teams wanting easy access across all projects
  #
  # Option 2: jira:projectSettingsPage (COMMENTED OUT)
  #   - Appears in Project Settings → Apps (per project)
  #   - Admin-only access, must be enabled per project
  #   - Best for: Marketplace distribution, controlled rollout, sensitive projects
  #
  # To switch: Comment out one module and uncomment the other, then redeploy.
  # ============================================================================

  # OPTION 1: Site-wide project page (visible in all project sidebars)
  jira:projectPage:
    - key: release-notes-generator-hello-world-project-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: AI-powered Release Notes Drafter

  # OPTION 2: Project-specific settings page (admin-only, per-project)
  # Uncomment the section below and comment out jira:projectPage above to use this
  # jira:projectSettingsPage:
  #   - key: release-notes-generator-project-settings-page
  #     resource: main
  #     resolver:
  #       function: resolver
  #     render: native
  #     title: AI-powered Release Notes Drafter

  function:
    - key: resolver
      handler: index.handler

permissions:
  scopes:
    - read:jira-work
    - write:confluence-content
    - read:confluence-content.summary
    - read:space:confluence
    - write:page:confluence
  external:
    fetch:
      backend:
        - address: api.openai.com

resources:
  - key: main
    path: src/frontend/index.jsx

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/2ef8450b-7377-4520-bf7d-7274d6e5bd45
